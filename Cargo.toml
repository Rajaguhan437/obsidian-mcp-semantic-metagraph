[package]
name = "obsidian-mcp-semantic-metagraph"
version = "0.1.0"
edition = "2024"
description = "Obsidian MCP server with passage-level semantic retrieval, metadata/provenance and graph tools. Fork of lstpsche/obsidian-mcp."
license = "MIT"
repository = "https://github.com/Rajaguhan437/obsidian-mcp-semantic-metagraph"
keywords = ["mcp", "obsidian", "vault", "rag", "semantic-search"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rmcp = { version = "1.6", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
schemars = "1.0"
pulldown-cmark = "0.13"
notify = "8"
notify-debouncer-mini = "0.7"
walkdir = "2"
globset = "0.4"
regex = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1.25"
tantivy = "0.26"
fastembed = { version = "5", optional = true }
bincode = { version = "2", optional = true, features = ["serde"] }
fs2 = "0.4"
sha2 = "0.11"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = ">=0.4.45, <0.5"
zip = { version = "8", default-features = false, features = ["deflate"] }
zeroize = "1"
tempfile = { version = "3", optional = true }

[features]
default = []
embeddings = ["dep:fastembed", "dep:bincode", "dep:tempfile"]
embeddings-api = ["dep:bincode", "dep:tempfile", "reqwest/blocking", "reqwest/json"]

[dev-dependencies]
tempfile = "3"

# The package is renamed, but the library crate name is pinned: `src/`, the
# binaries and 48 references across `tests/` all `use obsidian_mcp::...`.
# Without this, the lib would become `obsidian_mcp_semantic_metagraph`.
[lib]
name = "obsidian_mcp"
path = "src/lib.rs"

[[bin]]
name = "obsidian-mcp"
path = "src/main.rs"

[[bin]]
name = "obsidian-semanticd"
path = "src/bin/obsidian-semanticd.rs"
